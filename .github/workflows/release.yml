name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
  
    steps:
      - name: Generate and publish formula
        uses: Justintime50/homebrew-releaser@v3
        with:
          homebrew_owner: MyCode83
          homebrew_tap: homebrew-godirb
          formula_folder: Formula
  
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  
          commit_owner: MyCode83
          commit_email: MyCode83@users.noreply.github.com
  
          depends_on: '"go" => :build'
  
          install: |
            system "go", "build",
              *std_go_args(ldflags: "-s -w -X main.version=#{version}"),
              "."
  
          test: |
            assert_match version.to_s, shell_output("#{bin}/godirb --version")
  
          debug: true
  winget:
    name: Update WinGet manifest
    needs: release
    runs-on: windows-latest

    steps:
      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download WingetCreate
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/wingetcreate/latest" `
            -OutFile "wingetcreate.exe"

      - name: Generate WinGet manifests
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $x86 = "https://github.com/MyCode83/godirb/releases/download/v$version/godirb_${version}_windows_386.zip|x86"
          $x64 = "https://github.com/MyCode83/godirb/releases/download/v$version/godirb_${version}_windows_amd64.zip|x64"
          $arm64 = "https://github.com/MyCode83/godirb/releases/download/v$version/godirb_${version}_windows_arm64.zip|arm64"

          .\wingetcreate.exe update MyCode83.godirb `
            --version $version `
            --urls "$x86" "$x64" "$arm64" `
            --out manifests `
            --token $env:WINGET_TOKEN

      - name: Add ReleaseNotes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = gh release view "${{ github.ref_name }}" `
            --repo MyCode83/godirb `
            --json body `
            --jq ".body"

          $file = Get-ChildItem manifests -Recurse -Filter "*.locale.en-US.yaml" |
            Select-Object -First 1

          $content = Get-Content $file.FullName -Raw

          $notes = (($notes -replace "`r", "") -split "`n" |
            ForEach-Object { "  $_" }) -join "`n"

          $content = $content -replace `
            "(?m)^ReleaseNotesUrl:", `
            "ReleaseNotes: |`n$notes`nReleaseNotesUrl:"

          Set-Content $file.FullName $content -Encoding utf8

      - name: Submit WinGet PR
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $manifest = Get-ChildItem `
            -Path "manifests" `
            -Recurse `
            -Filter "MyCode83.godirb.yaml" |
            Where-Object { $_.DirectoryName -like "*\$version" } |
            Select-Object -First 1

          if (-not $manifest) {
            Write-Host "Generated files:"
            Get-ChildItem manifests -Recurse
            throw "Could not find generated WinGet manifest for $version"
          }

          $manifestPath = $manifest.Directory.FullName

          .\wingetcreate.exe submit `
            "$manifestPath" `
            --token $env:WINGET_TOKEN
