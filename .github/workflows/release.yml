name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Generate and publish formula
        uses: Justintime50/homebrew-releaser@v3
        with:
          homebrew_owner: MyCode83
          homebrew_tap: homebrew-godirb
          formula_folder: Formula

          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

          commit_owner: MyCode83
          commit_email: MyCode83@users.noreply.github.com

          depends_on: '"go" => :build'

          install: |
            system "go", "build", *std_go_args(ldflags: "-s -w"), "."

          test: |
            system "#{bin}/godirb", "--help"

          debug: true
